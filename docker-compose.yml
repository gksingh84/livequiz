services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: livequiz
      POSTGRES_PASSWORD: livequiz
      POSTGRES_DB: livequiz
    ports:
      - "5432:5432"
    volumes:
      - livequiz_data:/var/lib/postgresql/data
volumes:
  livequiz_data:
